services:
  - type: web
    name: music-party-game
    env: node
    plan: free
    buildCommand: chmod +x ./render-build.sh && ./render-build.sh
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
