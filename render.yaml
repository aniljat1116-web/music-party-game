services:
  - type: web
    name: music-party-game
    env: node
    plan: free
    buildCommand: chmod +x ./render-build.sh && ./render-build.sh
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: YT_AI_SERVICE_URL
        value: https://tools.ruvs.in
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
